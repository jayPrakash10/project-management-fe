<!doctype html>
<html lang="en" data-mode="light" data-accent="coral">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow: plan projects, track tasks, and collaborate with your team." />
    <title>TaskFlow</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong colors.
      // Keep the keys and allowed values in sync with src/lib/theme.ts.
      (function () {
        var accents = ['coral', 'indigo', 'emerald', 'amber', 'violet', 'ocean'];
        var mode = 'system';
        var accent = 'coral';
        try {
          mode = localStorage.getItem('taskflow.theme.mode') || 'system';
          accent = localStorage.getItem('taskflow.theme.accent') || 'coral';
        } catch (e) {}
        if (accents.indexOf(accent) === -1) accent = 'coral';
        var dark =
          mode === 'dark' ||
          (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
        document.documentElement.dataset.accent = accent;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
